name: CyberMarket GraphQL security evidence

on:
  pull_request:
    paths:
      - "saleor/graphql/tests/test_cybermarket_security_contracts.py"
      - "security/cybermarket/**"
      - ".github/workflows/cybermarket-security.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cybermarket-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  research-security-tests:
    name: Cross-operation security contracts
    runs-on: ubuntu-latest
    container: python:3.12
    timeout-minutes: 25
    services:
      postgres:
        image: library/postgres:15-alpine
        env:
          POSTGRES_PASSWORD: saleor
          POSTGRES_USER: saleor
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      cache:
        image: valkey/valkey:8.1-alpine
        options: >-
          --health-cmd "valkey-cli ping | grep PONG"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CACHE_URL: redis://cache:6379/0
      DATABASE_URL: postgres://saleor:saleor@postgres:5432/saleor
      SECRET_KEY: cybermarket-ci-synthetic-only

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install system requirements
        run: apt-get update && apt-get install -y libpq-dev
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
      - name: Install locked Python dependencies
        run: uv sync --locked
      - name: Run focused tests and collect JUnit XML
        run: |
          mkdir -p security-results
          uv run pytest saleor/graphql/tests/test_cybermarket_security_contracts.py \
            -q --junitxml=security-results/cybermarket-junit.xml \
            -o junit_family=legacy
      - name: Upload evidence on success or failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cybermarket-security-junit
          path: security-results/
          if-no-files-found: warn
          retention-days: 30
